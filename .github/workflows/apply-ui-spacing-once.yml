name: Apply UI spacing fix again

on:
  push:
    branches: [fix/stabilize-game-ui-regressions]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Increase visual separation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/ui/main_window.py')
          text = p.read_text(encoding='utf-8')
          old = '        cl.addWidget(self.current_label)\n        cl.addSpacing(8)\n        self.call_state = QLabel("¡LISTO PARA JUGAR!")'
          new = '        cl.addWidget(self.current_label)\n        cl.addSpacing(12)\n        self.call_state = QLabel("¡LISTO PARA JUGAR!")'
          if old not in text:
              raise SystemExit('target block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/apply-ui-spacing-once.yml
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/ui/main_window.py .github/workflows/apply-ui-spacing-once.yml
          git commit -m 'fix: aumentar separacion del numero actual'
          git push
