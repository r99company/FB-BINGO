name: Windows installer

on:
  push:
    branches: [main, feature/windows-installer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m pytest

      - name: Build executable with explicit PySide6 bundle
        run: |
          python -m PyInstaller --clean --noconfirm packaging\FB-BINGO.spec

      - name: Add Microsoft Visual C++ runtime to bundle
        shell: powershell
        run: |
          $bundle = "dist\FB-BINGO"
          $internal = "$bundle\_internal"
          $qtDir = "$internal\PySide6"
          New-Item -ItemType Directory -Force -Path $qtDir | Out-Null

          $runtimeNames = @(
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "msvcp140.dll",
            "msvcp140_1.dll",
            "concrt140.dll"
          )

          $runtimeRoots = @(
            $env:pythonLocation,
            (python -c "import sys; print(sys.prefix)"),
            "$env:WINDIR\System32"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique

          foreach ($name in $runtimeNames) {
            $found = $null
            foreach ($root in $runtimeRoots) {
              $candidate = Join-Path $root $name
              if (Test-Path $candidate) { $found = $candidate; break }
            }
            if ($found) {
              Copy-Item $found $internal -Force
              Copy-Item $found $qtDir -Force
              Write-Host "Runtime agregado: $name desde $found"
            } else {
              Write-Host "Runtime no encontrado en runner: $name"
            }
          }

      - name: Verify PyInstaller runtime files
        shell: powershell
        run: |
          $bundle = "dist\FB-BINGO"
          $internal = "$bundle\_internal"
          if (-not (Test-Path "$bundle\FB-BINGO.exe")) { throw "No se genero FB-BINGO.exe" }
          if (-not (Test-Path "$internal")) { throw "Falta el directorio _internal de PyInstaller" }
          if (-not (Get-ChildItem $internal -Recurse -Filter "python311.dll" -ErrorAction SilentlyContinue)) { throw "Falta python311.dll en el bundle" }
          if (-not (Get-ChildItem $internal -Recurse -Filter "Qt6Widgets.dll" -ErrorAction SilentlyContinue)) { throw "Falta Qt6Widgets.dll en el bundle" }
          if (-not (Get-ChildItem $internal -Recurse -Filter "QtWidgets.pyd" -ErrorAction SilentlyContinue)) { throw "Falta QtWidgets.pyd en el bundle" }
          Write-Host "Runtime de PyInstaller y binarios de Qt verificados."
          Get-ChildItem $internal -Recurse -Filter "Qt6Widgets.dll" | Select-Object FullName,Length
          Get-ChildItem $internal -Recurse -Filter "QtWidgets.pyd" | Select-Object FullName,Length
          Get-ChildItem $internal -Recurse -Filter "vcruntime*.dll" | Select-Object FullName,Length
          Get-ChildItem $internal -Recurse -Filter "msvcp*.dll" | Select-Object FullName,Length

      - name: Smoke test real del ejecutable
        shell: powershell
        run: |
          $exe = (Resolve-Path "dist\FB-BINGO\FB-BINGO.exe").Path
          Write-Host "Iniciando smoke test: $exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            $code = $p.ExitCode
            throw "FB-BINGO.exe se cerro durante el smoke test. ExitCode=$code"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test OK: FB-BINGO.exe inicio correctamente y permanecio activo."

      - name: Build installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 no esta instalado en el runner." }
          & $iscc "packaging\FB-BINGO.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer output
        shell: powershell
        run: |
          $installer = Get-ChildItem "packaging\installer\FB-BINGO-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No se genero el instalador." }
          Write-Host "Instalador generado: $($installer.FullName) ($($installer.Length) bytes)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FB-BINGO-Windows-Installer
          path: packaging/installer/FB-BINGO-Setup-*.exe
          if-no-files-found: error

      - name: Package portable bundle
        shell: powershell
        run: Compress-Archive -Path "dist\FB-BINGO\*" -DestinationPath "dist\FB-BINGO-Windows-Portable.zip" -Force

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: FB-BINGO-Windows-Portable
          path: dist/FB-BINGO-Windows-Portable.zip
          if-no-files-found: error
