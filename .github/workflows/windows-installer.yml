name: Windows installer

on:
  push:
    branches: [main, feature/windows-installer]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Run tests
        run: python -m pytest

      - name: Build executable
        run: |
          python -m PyInstaller --clean --noconfirm --windowed --name FB-BINGO app/ui/main.py

      - name: Verify PyInstaller runtime files
        shell: powershell
        run: |
          $bundle = "dist\FB-BINGO"
          $internal = "$bundle\_internal"
          if (-not (Test-Path "$bundle\FB-BINGO.exe")) { throw "No se genero FB-BINGO.exe" }
          if (-not (Test-Path "$internal\python311.dll")) { throw "Falta python311.dll en el directorio _internal de PyInstaller" }
          if (-not (Test-Path "$internal")) { throw "Falta el directorio _internal de PyInstaller" }
          Write-Host "Runtime de PyInstaller verificado: $internal\python311.dll"
          Get-ChildItem $bundle | Select-Object Name,Length
          Get-ChildItem $internal | Select-Object -First 20 Name,Length

      - name: Build installer
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 no esta instalado en el runner." }
          & $iscc "packaging\FB-BINGO.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer output
        shell: powershell
        run: |
          $installer = Get-ChildItem "packaging\installer\FB-BINGO-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No se genero el instalador." }
          Write-Host "Instalador generado: $($installer.FullName) ($($installer.Length) bytes)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FB-BINGO-Windows-Installer
          path: packaging/installer/FB-BINGO-Setup-*.exe
          if-no-files-found: error

      - name: Package portable bundle
        shell: powershell
        run: Compress-Archive -Path "dist\FB-BINGO\*" -DestinationPath "dist\FB-BINGO-Windows-Portable.zip" -Force

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: FB-BINGO-Windows-Portable
          path: dist/FB-BINGO-Windows-Portable.zip
          if-no-files-found: error
