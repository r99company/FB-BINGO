name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest pyinstaller
      - name: Test
        run: python -m pytest
      - name: Build EXE
        run: pyinstaller --clean --noconfirm fb_bingo.spec
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: FB-BINGO-Windows
          path: dist/FB-BINGO.exe
