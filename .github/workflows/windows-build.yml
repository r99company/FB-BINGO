name: Windows build

# Canonical Windows packaging is handled by windows-installer.yml.
# Keep this workflow as a lightweight executable build for manual/legacy use,
# but point it at the real onedir PyInstaller spec.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller pillow
      - name: Generate icon
        run: python packaging\make_icon.py
      - name: Test
        run: python -m pytest
      - name: Build EXE
        run: python -m PyInstaller --clean --noconfirm packaging\FB-BINGO.spec
      - name: Verify EXE bundle
        shell: powershell
        run: |
          if (-not (Test-Path "dist\FB-BINGO\FB-BINGO.exe")) { throw "No se genero FB-BINGO.exe" }
          if (-not (Test-Path "dist\FB-BINGO\_internal\python311.dll")) { throw "Falta python311.dll" }
      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: FB-BINGO-Windows
          path: dist/FB-BINGO/**
