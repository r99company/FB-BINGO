<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#39D9FF"/><stop offset="0.55" stop-color="#EAFBFF"/><stop offset="1" stop-color="#FF78B8"/></linearGradient>
 <linearGradient id="fb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#45DDFB"/><stop offset="1" stop-color="#168BC8"/></linearGradient>
 <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FF8CC5"/><stop offset="1" stop-color="#E9358B"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-opacity=".25"/></filter>
</defs>
<rect x="18" y="18" width="988" height="988" rx="150" fill="url(#bg)" stroke="#28CFF2" stroke-width="24"/>
<path d="M80 610 C230 500 360 520 500 650 S790 820 950 650" fill="none" stroke="#FF73B6" stroke-width="34" opacity=".8"/>
<path d="M70 720 C250 600 380 650 540 760 S800 870 950 740" fill="none" stroke="#32C9F3" stroke-width="22" opacity=".9"/>

<!-- Miniatura del cartón real: 3 filas x 9 columnas, sin letras, 15 números -->
<g transform="translate(175 105) rotate(-4 335 175)" filter="url(#shadow)">
 <rect width="674" height="350" rx="34" fill="#FFFFFF" stroke="#25C7F0" stroke-width="14"/>
 <rect x="22" y="22" width="630" height="306" rx="20" fill="#F9FDFF" stroke="#FF63AD" stroke-width="5"/>
 <g stroke="#A9DFF1" stroke-width="4">
  <path d="M92 22V328M162 22V328M232 22V328M302 22V328M372 22V328M442 22V328M512 22V328M582 22V328"/>
  <path d="M22 124H652M22 226H652"/>
 </g>
 <g font-family="Segoe UI, Arial" font-size="42" font-weight="900" fill="#123A70" text-anchor="middle">
  <text x="57" y="92">3</text><text x="127" y="92">12</text><text x="197" y="92">27</text><text x="267" y="92">34</text><text x="337" y="92">41</text><text x="477" y="92">63</text>
  <text x="127" y="194">15</text><text x="267" y="194">37</text><text x="337" y="194">48</text><text x="407" y="194">56</text><text x="547" y="194">73</text>
  <text x="57" y="296">9</text><text x="197" y="296">22</text><text x="407" y="296">59</text><text x="477" y="296">67</text>
 </g>
</g>

<!-- Corona -->
<path d="M398 385 L432 332 L475 365 L512 304 L549 365 L592 332 L626 385 L605 422 H419 Z" fill="url(#pink)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" filter="url(#shadow)"/>

<!-- Monograma FB -->
<g filter="url(#shadow)">
 <rect x="278" y="390" width="468" height="205" rx="46" fill="#082B61" stroke="#FFFFFF" stroke-width="12"/>
 <text x="320" y="545" font-family="Segoe UI, Arial" font-size="168" font-weight="1000" fill="url(#fb)">F</text>
 <text x="505" y="545" font-family="Segoe UI, Arial" font-size="168" font-weight="1000" fill="url(#pink)">B</text>
</g>

<text x="512" y="690" text-anchor="middle" font-family="Segoe UI, Arial" font-size="118" font-weight="1000" letter-spacing="2" fill="#123A70" stroke="#FFFFFF" stroke-width="8" paint-order="stroke">BINGO</text>

<!-- Bolas -->
<g filter="url(#shadow)">
 <circle cx="245" cy="760" r="86" fill="url(#pink)" stroke="#FFFFFF" stroke-width="10"/>
 <circle cx="512" cy="770" r="94" fill="url(#fb)" stroke="#FFFFFF" stroke-width="10"/>
 <circle cx="780" cy="760" r="86" fill="url(#pink)" stroke="#FFFFFF" stroke-width="10"/>
 <circle cx="245" cy="760" r="55" fill="#FFFFFF" opacity=".95"/>
 <circle cx="512" cy="770" r="61" fill="#FFFFFF" opacity=".95"/>
 <circle cx="780" cy="760" r="55" fill="#FFFFFF" opacity=".95"/>
 <g font-family="Segoe UI, Arial" font-size="58" font-weight="1000" fill="#123A70" text-anchor="middle" dominant-baseline="middle">
  <text x="245" y="760">17</text><text x="512" y="770">45</text><text x="780" y="760">72</text>
 </g>
</g>

<text x="512" y="905" text-anchor="middle" font-family="Segoe Script, Brush Script MT, cursive" font-size="52" font-weight="700" fill="#123A70">Tu Bingo, Siempre</text>
<path d="M360 928 Q512 955 664 928" fill="none" stroke="#FF4FA5" stroke-width="12" stroke-linecap="round"/>
</svg>
